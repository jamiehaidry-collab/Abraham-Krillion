<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#14223a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Abrahamillion">
<title>Abrahamillion</title>
__ICONS__
__FONTS__
<style>
:root{--ink:#0a1120;--panel:#14223a;--panel-2:#0c1628;--edge:#2f4c78;--text:#f7efdc;--muted:#b7c7da;--pink:#ec6a92;--pink-d:#b5456c;--pink-l:#ffa9c3;--cyan:#72dbef;
  --o:0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink)}
*,*::before,*::after{box-sizing:border-box}
html{background:#80cfe6}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;color:var(--text);
  font:18px/1.3 'Jersey 10',system-ui,-apple-system,'Segoe UI',sans-serif;letter-spacing:.02em;font-synthesis:none;
  background:linear-gradient(#80cfe6 0%,#b4e6e2 42%,#fbf1c9 66%,#4a9c4b 66%,#3f8d45 100%)}
.gate{width:100%;max-width:380px;text-align:center}
.eagle{display:block;width:88px;height:88px;margin:0 auto 14px;image-rendering:pixelated;box-shadow:var(--o)}
h1{margin:0 0 18px;font-family:'Silkscreen','Jersey 10',monospace;font-weight:700;font-size:clamp(26px,8.4vw,36px);line-height:1;text-transform:uppercase;color:var(--text);
  text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),3px 3px 0 var(--ink),-3px -3px 0 var(--ink),3px -3px 0 var(--ink),-3px 3px 0 var(--ink),3px 7px 0 var(--pink),0 9px 0 var(--ink)}
.panel{margin:3px;padding:18px;background:var(--panel);text-align:left;box-shadow:var(--o),inset 0 3px 0 0 rgba(255,255,255,.1),inset 0 -3px 0 0 rgba(0,0,0,.3)}
label{display:block;font-family:'Silkscreen',monospace;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
input[type=password]{display:block;width:calc(100% - 6px);height:54px;margin:3px;padding:0 12px;border:0;border-radius:0;background:var(--panel-2);color:var(--text);
  font:24px 'Jersey 10',system-ui,sans-serif;box-shadow:var(--o),inset 0 0 0 3px var(--edge);-webkit-appearance:none;appearance:none}
input[type=password]:focus{outline:none;box-shadow:var(--o),inset 0 0 0 3px var(--cyan)}
button{display:block;width:calc(100% - 6px);min-height:54px;margin:14px 3px 3px;border:0;border-radius:0;cursor:pointer;background:var(--pink);color:var(--ink);
  font-family:'Silkscreen',monospace;font-weight:700;font-size:19px;text-transform:uppercase;box-shadow:var(--o),inset 0 -5px 0 0 var(--pink-d),inset 0 4px 0 0 var(--pink-l)}
button:active{transform:translateY(2px)}
button:focus-visible,.remember input:focus-visible{outline:3px solid #fff;outline-offset:5px}
button:disabled{opacity:.6;cursor:wait}
.remember{display:flex;align-items:center;gap:8px;margin:14px 0 0;font:17px 'Jersey 10',system-ui,sans-serif;letter-spacing:.02em;text-transform:none;color:var(--muted)}
.remember input{width:18px;height:18px;margin:0;accent-color:var(--pink)}
.msg{min-height:1.3em;margin:12px 0 0;color:var(--pink-l)}
.hint{margin:10px 0 0;font-size:16px;color:var(--muted)}
.checking .panel{visibility:hidden}
</style>
</head>
<body class="checking">
<main class="gate">
  <img class="eagle" src="__EAGLE__" alt="">
  <h1>Abrahamillion</h1>
  <form id="gateForm" class="panel" autocomplete="on">
    <label for="pw">House password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <button id="go" type="submit">Enter</button>
    <label class="remember"><input id="remember" type="checkbox" checked> Remember on this device</label>
    <p id="msg" class="msg" role="alert"></p>
    <p class="hint">Ask whoever sent you the link for the password.</p>
  </form>
</main>
<script id="payload" type="application/json">__PAYLOAD__</script>
<script>
// The game is encrypted with the house password (AES-GCM, key from PBKDF2-SHA256).
// Everything stays inside this function so nothing clashes with the game once it opens.
(function () {
  'use strict';
  var KEY = 'abrahamillion.key';
  var P = JSON.parse(document.getElementById('payload').textContent);
  var subtle = window.crypto && window.crypto.subtle;
  var form = document.getElementById('gateForm'), pw = document.getElementById('pw'), msg = document.getElementById('msg'), go = document.getElementById('go');
  function fromB64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function toB64(buf) { var u = new Uint8Array(buf), s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function store(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* storage blocked */ } }
  function read(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function ready() { document.body.classList.remove('checking'); pw.focus(); }

  function deriveKey(password) {
    return subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']).then(function (base) {
      return subtle.deriveKey({ name: 'PBKDF2', salt: fromB64(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    });
  }
  function unlock(key) {
    return subtle.decrypt({ name: 'AES-GCM', iv: fromB64(P.iv) }, key, fromB64(P.data)).then(function (buf) { return new TextDecoder().decode(buf); });
  }
  function openGame(html) { document.open(); document.write(html); document.close(); }

  if (!subtle) { msg.textContent = 'This browser can’t open the game. Use an up-to-date browser and the https:// link.'; ready(); return; }

  // A key remembered from an earlier visit opens the game straight away.
  var saved = read(KEY);
  var first = saved
    ? subtle.importKey('raw', fromB64(saved), 'AES-GCM', false, ['decrypt']).then(unlock).then(openGame, function () { store(KEY, null); ready(); })
    : Promise.resolve(ready());
  void first;

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!pw.value) return;
    go.disabled = true; msg.textContent = '';
    var key;
    deriveKey(pw.value).then(function (k) { key = k; return unlock(k); }).then(function (html) {
      if (document.getElementById('remember').checked) {
        return subtle.exportKey('raw', key).then(function (raw) { store(KEY, toB64(raw)); return html; });
      }
      return html;
    }).then(openGame, function () {
      go.disabled = false; msg.textContent = 'That’s not the house password.'; pw.select();
    });
  });
})();
</script>
</body>
</html>
