# Builds the password-locked game and publishes it with GitHub Pages.
# Needs: Settings > Pages > Source "GitHub Actions", and a repository secret named SITE_PASSWORD
# (Settings > Secrets and variables > Actions). Without the secret the build stops on purpose.
name: Publish game

on:
  push:
    branches: [claude/quirky-rubin-65d8pq, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the questions and the lock
        run: node --test tests/*.test.mjs
      - name: Build the password-locked page
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: node tools/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
