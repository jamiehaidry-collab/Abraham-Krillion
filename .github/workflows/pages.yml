# Builds the game and publishes it with GitHub Pages (Settings > Pages > Source "GitHub Actions").
# Optional: a repository secret named SITE_PASSWORD (Settings > Secrets and variables > Actions)
# locks the game behind that password. Without it, anyone with the link can play.
name: Publish game

# Publishes on every push to these branches, or by hand from Actions > Publish game > Run workflow.
on:
  push:
    branches: [claude/quirky-rubin-65d8pq, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the questions and the lock
        run: node --test tests/*.test.mjs
      - name: Build the page
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: node tools/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
